# Comments are written only for the rules themselves, not in this header.

complexity:
  active: true
  CognitiveComplexMethod:
    # Off by default in detekt; this is the metric the gate is built on.
    active: true
    allowedComplexity: 15
  CyclomaticComplexMethod:
    # Cognitive complexity is the metric we score. Cyclomatic counts every `when` entry
    # separately, so a wide but flat `when` over div properties would raise two findings
    # for one function without adding information.
    active: false
  LargeClass:
    # detekt's default is 600; 500 was agreed in review.
    active: true
    allowedLines: 500
  LongMethod:
    active: true
    allowedLines: 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
  NestedBlockDepth:
    active: true
    allowedDepth: 4

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

style:
  ReturnCount:
    # Guard clauses with early returns are an intentional style.
    active: false
