import com.yandex.div.gradle.FileExtensions
import org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

buildscript {
    FileExtensions.ifExists("${project.projectDir}/bootstrap.internal.gradle") {
        apply from: it
    }

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath libs.agp.gradle
        classpath libs.appmetrica.plugin
        classpath libs.nexusPublishPlugin
        classpath libs.protobuf
        classpath libs.unmock.plugin
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.kotlin.multiplatform.library) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false
}

apply from: "$projectDir/version.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == "com.christophsturm" && details.requested.name == "filepeek") {
                    details.useVersion "0.1.3"
                }
            }
        }
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            apiVersion = KotlinVersion.KOTLIN_2_2
            languageVersion = KotlinVersion.KOTLIN_2_2

            jvmTarget = JvmTarget.fromTarget(libs.versions.jvm.toolchain.get())
            jvmDefault = JvmDefaultMode.NO_COMPATIBILITY

            optIn.addAll(
                    "com.yandex.div.core.annotations.ExperimentalApi",
                    "com.yandex.div.core.annotations.InternalApi",
                    "com.yandex.div.data.DivModelInternalApi",
            )

            freeCompilerArgs.add("-Xannotation-default-target=param-property")

            if (name.toLowerCase().contains("release")) {
                freeCompilerArgs.addAll(
                        "-Xno-param-assertions",
                        "-Xno-call-assertions",
                        "-Xno-receiver-assertions",
                        "-Xno-source-debug-extension",
                )
            }
        }
    }
}

def metalavaGenerateSignature = tasks.register('metalavaGenerateSignature') {
    group = 'metalava'
    description = 'Generates Metalava signature files for every module applying the abi-validation convention.'
}

def metalavaCheckCompatibility = tasks.register('metalavaCheckCompatibility') {
    group = 'metalava'
    description = 'Checks API compatibility for every module applying the abi-validation convention.'
}

subprojects {
    configurations.configureEach {
        exclude group: "com.google.protobuf", module: "protobuf-lite"
        exclude group: "com.intellij", module: "annotations"
        exclude group: "io.appmetrica.analytics", module: "analytics-local-socket"
    }

    plugins.withId('me.tylerbwong.gradle.metalava') {
        metalavaGenerateSignature.configure {
            dependsOn tasks.matching {
                it.name == 'metalavaGenerateSignature' || it.name == 'metalavaGenerateSignatureRelease'
            }
        }

        metalavaCheckCompatibility.configure {
            dependsOn tasks.matching {
                it.name == 'metalavaCheckCompatibility' || it.name == 'metalavaCheckCompatibilityRelease'
            }
        }
    }

    afterEvaluate {
        project.tasks.withType(PublishToMavenRepository).configureEach { task ->
            task.finalizedBy(reportBuildNumber)
        }

        project.tasks.withType(PublishToMavenLocal).configureEach { task ->
            task.finalizedBy(reportVersion)
        }
    }
}

tasks.register('reportVersion') {
    def version = divkitVersion.releaseLibraryVersion
    doLast {
        println "DivKit version $version"
    }
}

tasks.register('reportBuildNumber') {
    def version = divkitVersion.releaseLibraryVersion
    doLast {
        println "buildNumber $version"
    }
}

FileExtensions.ifExists("${project.projectDir}/build.internal.gradle") {
    apply from: it
}
